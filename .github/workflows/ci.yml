# Generated by scripts/setup-ci.mjs.
# Selected modules: python, bash, github-actions, markdown
name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tooling:
    name: Node tooling
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Set up Node
        if: ${{ hashFiles('pnpm-lock.yaml') == '' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Set up Node with pnpm cache
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - name: Check formatting
        run: pnpm run format:check
      - name: Lint Markdown
        run: pnpm run lint:markdown

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Install dependencies
        run: uv sync --group dev
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Lint Python
        run: uv run ruff check .
      - name: Type-check Python
        run: uv run pyright
      - name: Run Python tests
        run: |
          if [ ! -d tests ]; then
            echo "No tests/ directory found; skipping pytest."
            exit 0
          fi

          set +e
          uv run pytest
          status=$?
          set -e
          if [ "$status" -eq 5 ]; then
            echo "No Python tests found; skipping pytest."
          else
            exit "$status"
          fi

  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go for lint tools
        uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install repository lint tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint GitHub Actions workflows
        run: actionlint
      - name: Check shell scripts
        run: |
          mapfile -t shell_files < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -not -path './node_modules/*' -not -path './dist/*' -not -path './build/*' -not -path './out/*' -not -path './target/*')
          if [ "${#shell_files[@]}" -eq 0 ]; then
            echo "No shell scripts found; skipping shell checks."
            exit 0
          fi

          shfmt -d -i 2 -ci -sr "${shell_files[@]}"
          shellcheck "${shell_files[@]}"
          for file in "${shell_files[@]}"; do
            bash -n "$file"
          done
