# Generated by scripts/setup-ci.mjs.
# Selected modules: python, bash, github-actions, markdown
name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tooling:
    name: Node tooling
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Set up Node
        if: ${{ hashFiles('pnpm-lock.yaml') == '' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
      - name: Set up Node with pnpm cache
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
          cache: pnpm
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - name: Check formatting
        run: pnpm run format:check
      - name: Lint Markdown
        run: pnpm run lint:markdown
      - name: Run setup-ci generator tests
        run: |
          if [ ! -f test/setup-ci.node-test.mjs ]; then
            echo "No test/setup-ci.node-test.mjs file found; skipping generator tests."
            exit 0
          fi

          node --test test/setup-ci.node-test.mjs

  python:
    name: Python
    runs-on: ubuntu-latest
    env:
      UV_MANAGED_PYTHON: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Prepare trusted Python directory
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-python-dir
        run: install -d -m 0700 "$UV_PYTHON_INSTALL_DIR"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-python-dir
        with:
          version: '0.10.7'
          python-version: '3.12.10'
      - name: Install trusted Python
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-python-dir
        run: uv python install --managed-python '3.12.10'
      - name: Install dependencies
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-python-dir
        run: |
          if [ -f uv.lock ]; then
            uv sync --locked --group dev --managed-python --python '3.12.10'
          else
            uv sync --group dev --managed-python --python '3.12.10'
          fi
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Lint Python
        run: uv run ruff check .
      - name: Type-check Python
        run: uv run pyright
      - name: Run Python tests
        run: |
          if [ ! -d tests ]; then
            echo "No tests/ directory found; skipping pytest."
            exit 0
          fi

          set +e
          uv run pytest
          status=$?
          set -e
          if [ "$status" -eq 5 ]; then
            echo "No Python tests found; skipping pytest."
          else
            exit "$status"
          fi

  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Go for lint tools
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.6'
      - name: Install repository lint tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint GitHub Actions workflows
        run: actionlint
      - name: Check shell scripts
        run: |
          mapfile -t shell_files < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) -not -path './.git/*' -not -path './node_modules/*' -not -path './dist/*' -not -path './build/*' -not -path './out/*' -not -path './target/*')
          if [ "${#shell_files[@]}" -eq 0 ]; then
            echo "No shell scripts found; skipping shell checks."
            exit 0
          fi

          shfmt -d -i 2 -ci -sr "${shell_files[@]}"
          shellcheck "${shell_files[@]}"
          for file in "${shell_files[@]}"; do
            bash -n "$file"
          done
