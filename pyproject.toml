# Generated by scripts/setup-ci.mjs.
[project]
name = "codex-host-workflows"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pyright>=1.1,<2",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures/ledger_authority"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
exclude = [
  ".cache",
  ".pytest_cache",
  ".pyright",
  ".ruff_cache",
  ".venv",
  "build",
  "coverage",
  "dist",
  "node_modules",
  "out",
  "target",
  "tests/fixtures/ledger_authority",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
